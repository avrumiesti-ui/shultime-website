    <style>
        :root {
            --primary-navy: #0f2b46;
            --accent-cream: #f9f7f2;
            --secondary-gold: #ffc107;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background-color: var(--accent-cream); color: var(--text-dark); line-height: 1.6; }
        
        /* Simple Header */
        header { background-color: var(--primary-navy); padding: 1rem 0; }
        .navbar { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; }
        .brand { font-size: 1.5rem; font-weight: bold; color: var(--accent-cream); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .brand img { height: 40px; border-radius: 8px; }

        /* Document Content */
        .legal-container { max-width: 800px; margin: 4rem auto; padding: 3rem 2rem; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .legal-container h1 { color: var(--primary-navy); margin-bottom: 0.5rem; font-size: 2.2rem; }
        .legal-container .last-updated { color: #666; font-style: italic; margin-bottom: 2rem; border-bottom: 2px solid #eee; padding-bottom: 1.5rem; display: block; }
        .legal-container h2 { color: var(--primary-navy); margin: 2.5rem 0 1rem 0; font-size: 1.3rem; border-bottom: 1px solid #f0f0f0; padding-bottom: 0.5rem; }
        .legal-container p { margin-bottom: 1rem; color: #444; }
        .legal-container ul { margin-left: 2rem; margin-bottom: 1.5rem; color: #444; }
        .legal-container li { margin-bottom: 0.5rem; }

        /* Footer */
        footer { background: #0a1f33; color: #8899a6; padding: 2rem 1.5rem; text-align: center; margin-top: 4rem; }
        footer a { color: white; text-decoration: none; margin: 0 10px; }
    </style>
